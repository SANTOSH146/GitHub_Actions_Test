
name: Java CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/javaapp

jobs:

  # 1. Run unit tests
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode clean test

  # 2. Build and push Docker image
  docker-build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

  # 3. Deploy to local Docker Desktop Kubernetes
  deploy:
    needs: docker-build
    runs-on: [self-hosted, Windows, X64]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes connection
        run: |
          kubectl config current-context
          kubectl get nodes

      - name: Apply Kubernetes manifest
        run: kubectl apply -f k8s/deployment.yaml

      - name: Update deployment image
        env:
          IMAGE: ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
        run: |
          kubectl set image deployment/javaapp-deployment javaapp=$env:IMAGE

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/javaapp-deployment --timeout=180s
          kubectl get deployments
          kubectl get pods
