name: Run unit test


on:
  push:
    branches: [master]
  pull_request:

permissions: 
  contents: read


jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit test
        run: mvn --batch-mode test
  
  docker-build:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t javaapp:${{ github.sha }} .

      - name: List Docker Images
        run: docker 
        
  print: 
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Print Secret Length
        env:
          MY_SECRET: ${{secrets.TOKEN}}
        run: |
         echo "Secret Length: ${#MY_SECRET}"



  deploy:
    needs: print
    if: github.ref == 'refs/heads/master'
    runs-on : ubuntu-latest
    steps:
      - name : Deploy Application
        run: echo "Deplpoying"


    