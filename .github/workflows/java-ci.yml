
name: Java CI/CD Pipeline

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  DOCKER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/javaapp

jobs:
  # 1. Run unit tests
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests
        run: mvn --batch-mode clean test

  # 2. Build and push Docker image
  docker-build:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest

    # Only push images for commits on master, not pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ github.sha }}
            ${{ env.DOCKER_IMAGE }}:latest

  # 3. Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    needs: docker-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: latest

      - name: Configure Kubernetes access
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 --decode > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Check cluster connection
        run: kubectl get nodes

      - name: Deploy application
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl set image deployment/javaapp-deployment \
            javaapp=${{ env.DOCKER_IMAGE }}:${{ github.sha }}

      - name: Verify deployment
        run: |
          kubectl rollout status deployment/javaapp-deployment --timeout=180s
          kubectl get deployments
          kubectl get pods
