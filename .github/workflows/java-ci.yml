name: Run unit test

on:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit test
        run: mvn --batch-mode test

  Deploy:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on : ubuntu-latest
    steps:
      - name : Deploy Application
        run: echo "Deplpoying"


    